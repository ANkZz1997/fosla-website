# Vercel's free (Hobby) plan only allows a cron job once a day. This calls the same endpoint every 30 minutes for free.
# Setup: repo Settings > Secrets and variables > Actions >
#   secret  CRON_SECRET  (same value as in Vercel)
#   variable APP_URL     (e.g. https://your-app.vercel.app, no trailing slash)
name: Check for new jobs

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger the app
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL" && test -n "$CRON_SECRET" || { echo "Set the APP_URL variable and CRON_SECRET secret"; exit 1; }
          curl --fail --silent --show-error --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/run"
